    </p>

    <div class="category-pills stagger" id="category-pills">
      <button class="category-pill" data-cat="ai"><span class="pill-emoji">🤖</span>Yapay Zeka</button>

      <button class="category-pill" data-cat="science"><span class="pill-emoji">🔬</span>Bilim</button>
    </div>

    <div class="time-toggle-wrapper fade-in-up" style="animation-delay:0.35s">

      <div class="time-toggle" id="time-toggle">
        <div class="time-toggle-slider" id="time-toggle-slider"></div>
        <button class="time-toggle-btn active" data-scope="daily" id="btn-daily">☀️ Bugün</button>
        <button class="time-toggle-btn" data-scope="weekly" id="btn-weekly">📅 Bu Hafta</button>
      </div>
    </div>

    <button class="onboarding-cta fade-in-up" style="animation-delay:0.4s" id="btn-start" disabled>
      Akışı Başlat →
    </button>
  </div>

  <!-- ========== FEED TOPBAR ========== -->
  <div class="feed-topbar" id="feed-topbar" style="display:none">
    <span class="logo-mini">PUNTO</span>
    <div class="filter-chips" id="filter-chips"></div>

  <div id="feed-container" style="display:none"></div>

    </div>
  </div>

  const $feedTopbar     = document.getElementById("feed-topbar");
  const $filterChips    = document.getElementById("filter-chips");
  const $progressDots   = document.getElementById("progress-dots");
  const $sheetBackdrop  = document.getElementById("sheet-backdrop");
  const $bottomSheet    = document.getElementById("bottom-sheet");
  const $sheetBody      = document.getElementById("sheet-body");

  // ─── Init ───
  function init() {
    loadPreferences();
    setupOnboarding();
  }

  // ─── LocalStorage ───
  function loadPreferences() {
    try {
      const saved = JSON.parse(localStorage.getItem("punto_prefs"));
      if (saved && saved.categories && saved.categories.length > 0) {
        state.selectedCategories = saved.categories;
        state.timeScope = saved.timeScope || "daily";
        state.bookmarks = new Set(saved.bookmarks || []);
        startFeed();
        return;
      }
    } catch (e) { /* first time */ }
  }

  function savePreferences() {
    localStorage.setItem("punto_prefs", JSON.stringify({
      categories: state.selectedCategories,
      timeScope: state.timeScope,
      bookmarks: [...state.bookmarks],
    }));
  }

  // ═══════════════════════════════════════
  //  ONBOARDING
  // ═══════════════════════════════════════
  function setupOnboarding() {
    // Category pill clicks
    $categoryPills.querySelectorAll(".category-pill").forEach(pill => {
      const cat = pill.dataset.cat;
      if (state.selectedCategories.includes(cat)) pill.classList.add("active");

      pill.addEventListener("click", () => {
        pill.classList.toggle("active");
        if (state.selectedCategories.includes(cat)) {
          state.selectedCategories = state.selectedCategories.filter(c => c !== cat);
        } else {
          state.selectedCategories.push(cat);
        }
        $btnStart.disabled = state.selectedCategories.length === 0;
      });
    });

    // Time toggle
    $btnDaily.addEventListener("click", () => setTimeScope("daily"));
    $btnWeekly.addEventListener("click", () => setTimeScope("weekly"));

    // Start button
    $btnStart.addEventListener("click", () => {
      if (state.selectedCategories.length === 0) return;
      savePreferences();
      startFeed();
    });
  }

  function setTimeScope(scope) {
    state.timeScope = scope;
    $btnDaily.classList.toggle("active", scope === "daily");
    $btnWeekly.classList.toggle("active", scope === "weekly");
    $timeSlider.classList.toggle("weekly", scope === "weekly");
  }

  // ═══════════════════════════════════════
  //  FEED
  // ═══════════════════════════════════════
  function startFeed() {
    $onboarding.classList.add("hidden");
    setTimeout(() => { $onboarding.style.display = "none"; }, 500);

    $feedContainer.style.display = "block";
    $feedTopbar.style.display = "flex";
    $progressDots.style.display = "flex";

    buildFilterChips();
    filterAndRender();
  }

  function buildFilterChips() {
    $filterChips.innerHTML = "";

    // "All" chip
    const allChip = document.createElement("button");
    allChip.className = "filter-chip active";
    allChip.textContent = "Tümü";
    allChip.dataset.filter = "all";
    allChip.addEventListener("click", () => applyFilter("all"));
    $filterChips.appendChild(allChip);

    state.selectedCategories.forEach(cat => {
      const cfg = CAT_CONFIG[cat];
      const chip = document.createElement("button");
      chip.className = "filter-chip";
      chip.textContent = cfg.emoji + " " + cfg.label;
      chip.dataset.filter = cat;
      chip.addEventListener("click", () => applyFilter(cat));
      $filterChips.appendChild(chip);
    });
  }

  function applyFilter(filter) {
    state.activeFilter = filter;
    $filterChips.querySelectorAll(".filter-chip").forEach(c => {
      c.classList.toggle("active", c.dataset.filter === filter);
    });
    filterAndRender();
  }

  function filterAndRender() {
    let news = NEWS_DATA.filter(n =>
      state.selectedCategories.includes(n.category) &&
      n.scope === state.timeScope
    );

    if (state.activeFilter !== "all") {
      news = news.filter(n => n.category === state.activeFilter);
    }

    state.filteredNews = news;
    state.currentCardIndex = 0;
    renderFeed(news);
    buildProgressDots(news.length);
    updateProgressDots(0);
  }

  function renderFeed(items) {
    $feedContainer.innerHTML = "";

    if (items.length === 0) {
      $feedContainer.innerHTML = renderEndOfFeed("Bu filtrede haber bulunamadı.", "Farklı bir kategori veya zaman aralığı seç.");
      return;
    }

    items.forEach((item, idx) => {
      $feedContainer.innerHTML += renderCard(item, idx);
    });

    // End of feed card
    $feedContainer.innerHTML += renderEndOfFeed(
      "Tüm gelişmeler yakalandı! 🎉",
      "Yeni haberler geldikçe akış güncellenecek."
    );

    // Attach card event listeners
    attachCardListeners();

    // Scroll spy
    setupScrollSpy();
  }

  function renderCard(item, idx) {
    const cfg = CAT_CONFIG[item.category];
    const isBookmarked = state.bookmarks.has(item.id);

    return `
      <article class="news-card" data-id="${item.id}" data-index="${idx}" id="card-${item.id}">
        <div class="card-bg" style="background-image: url('${item.image_url}'); background-color: #1a1a2e;"></div>
        <div class="card-scrim"></div>

        <div class="card-meta-top">
          <span class="category-badge ${cfg.badgeClass}">
            ${cfg.emoji} ${cfg.label}
          </span>
          <span class="read-time-badge">⏱ ${item.read_time}</span>
        </div>

        <div class="card-content">
          <span class="card-time-ago">${item.time_ago}</span>
          <h2 class="card-headline">${item.title}</h2>
          <div class="card-actions">
            <button class="btn-read-story" data-id="${item.id}" aria-label="Haberi Oku">
              <span>Haberi Oku</span>
              <svg class="chevron-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
              </svg>
            </button>
            <button class="btn-side-action btn-share" data-id="${item.id}" aria-label="Paylaş" title="Paylaş">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
              </svg>
            </button>
            <button class="btn-side-action btn-bookmark ${isBookmarked ? 'bookmarked' : ''}" data-id="${item.id}" aria-label="Kaydet" title="Kaydet">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="${isBookmarked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
              </svg>
            </button>
          </div>
        </div>
      </article>
    `;
  }

  function renderEndOfFeed(title, subtitle) {
    return `
      <div class="end-of-feed">
        <div class="end-icon">✅</div>
        <h3 class="end-title">${title}</h3>
        <p class="end-subtitle">${subtitle}</p>
      </div>
    `;
  }

  function attachCardListeners() {
    // Read Story buttons
    document.querySelectorAll(".btn-read-story").forEach(btn => {
      btn.addEventListener("click", () => openSheet(btn.dataset.id));
    });

    // Share buttons
    document.querySelectorAll(".btn-share").forEach(btn => {
      btn.addEventListener("click", () => shareNews(btn.dataset.id));
    });

    // Bookmark buttons
    document.querySelectorAll(".btn-bookmark").forEach(btn => {
      btn.addEventListener("click", () => toggleBookmark(btn));
    });
  }

  // ─── Scroll Spy ───
  function setupScrollSpy() {
    let ticking = false;
    $feedContainer.addEventListener("scroll", () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          const scrollTop = $feedContainer.scrollTop;
          const cardHeight = window.innerHeight;
          const idx = Math.round(scrollTop / cardHeight);
          if (idx !== state.currentCardIndex) {
            state.currentCardIndex = idx;
            updateProgressDots(idx);
          }
          ticking = false;
        });
        ticking = true;
      }
    });
  }

  // ─── Progress Dots ───
  function buildProgressDots(count) {
    $progressDots.innerHTML = "";
    for (let i = 0; i < count; i++) {
      const dot = document.createElement("div");
      dot.className = "progress-dot";
      dot.dataset.index = i;
      $progressDots.appendChild(dot);
    }
  }

  function updateProgressDots(activeIdx) {
    $progressDots.querySelectorAll(".progress-dot").forEach((dot, i) => {
      dot.classList.toggle("active", i === activeIdx);
    });
  }

  // ═══════════════════════════════════════
  //  BOTTOM SHEET
  // ═══════════════════════════════════════
  function openSheet(newsId) {
    const item = NEWS_DATA.find(n => n.id === newsId);
    if (!item) return;

    const cfg = CAT_CONFIG[item.category];

    // Populate header
    $sheetCatDot.style.background = cfg.color;
    $sheetCatLabel.textContent = cfg.emoji + " " + cfg.label;

    // Populate body
    $sheetBody.innerHTML = `
      <h2 class="sheet-headline">${item.title}</h2>

      <div class="sheet-section">
        <div class="sheet-section-label">
          <span class="label-icon">📌</span> Özet
        </div>
        <div class="sheet-takeaway">${item.summary.key_takeaway}</div>
      </div>

      <div class="sheet-section">
        <div class="sheet-section-label">
          <span class="label-icon">🔹</span> Önemli Noktalar
        </div>
        <ul class="sheet-bullets">
          ${item.summary.bullets.map(b => `
            <li>
              <span class="bullet-dot"></span>
              <span>${b}</span>
            </li>
          `).join("")}
        </ul>
      </div>

      <div class="sheet-section">
        <div class="sheet-section-label">
          <span class="label-icon">🔗</span> Orijinal Kaynak
        </div>
        <a class="sheet-source" href="${item.summary.source_url}" target="_blank" rel="noopener noreferrer">
          <div class="source-info">
            <span class="source-name">${item.summary.source_name}</span>
            <span class="source-url">${item.summary.source_url.replace("https://", "")}</span>
          </div>
          <span class="source-arrow">→</span>
        </a>
      </div>
    `;

    // Show sheet
    $sheetBackdrop.classList.add("visible");
    $bottomSheet.classList.add("open");
    $feedContainer.classList.add("scroll-locked");

    // Escape key
    document.addEventListener("keydown", sheetEscHandler);
  }

  function closeSheet() {
    $sheetBackdrop.classList.remove("visible");
    $bottomSheet.classList.remove("open");
    $feedContainer.classList.remove("scroll-locked");
    document.removeEventListener("keydown", sheetEscHandler);
  }

  function sheetEscHandler(e) {
    if (e.key === "Escape") closeSheet();
  }

  $btnCloseSheet.addEventListener("click", closeSheet);
  $sheetBackdrop.addEventListener("click", closeSheet);

  // Pull-down to close on handle
  let sheetTouchStartY = 0;
  $sheetHandle.addEventListener("touchstart", (e) => {
    sheetTouchStartY = e.touches[0].clientY;
  });
  $sheetHandle.addEventListener("touchmove", (e) => {
    const diff = e.touches[0].clientY - sheetTouchStartY;
    if (diff > 60) closeSheet();
  });

  // ═══════════════════════════════════════
  //  SHARE & BOOKMARK
  // ═══════════════════════════════════════
  function shareNews(newsId) {
    const item = NEWS_DATA.find(n => n.id === newsId);
    if (!item) return;

    if (navigator.share) {
      navigator.share({
        title: item.title,
        text: item.summary.key_takeaway,
        url: item.summary.source_url,
      }).catch(() => {});
    } else {
      // Fallback: copy to clipboard
      navigator.clipboard.writeText(item.title + "\n" + item.summary.source_url)
        .then(() => showToast("📋 Bağlantı kopyalandı!"))
        .catch(() => showToast("Paylaşım desteklenmiyor"));
    }
  }

  function toggleBookmark(btn) {
    const id = btn.dataset.id;
    const svgPath = btn.querySelector("svg path") || btn.querySelector("svg");

    if (state.bookmarks.has(id)) {
      state.bookmarks.delete(id);
      btn.classList.remove("bookmarked");
      if (btn.querySelector("svg")) btn.querySelector("svg").setAttribute("fill", "none");
      showToast("🔖 Kaydedilenlerden çıkarıldı");
    } else {
      state.bookmarks.add(id);
      btn.classList.add("bookmarked");
      if (btn.querySelector("svg")) btn.querySelector("svg").setAttribute("fill", "currentColor");
      showToast("🔖 Kaydedildi!");

      // Micro-animation
      btn.style.transform = "scale(1.3)";
      setTimeout(() => { btn.style.transform = ""; }, 200);
    }

    savePreferences();
  }

  // ─── Toast ───
  function showToast(message) {
    $toast.textContent = message;
    $toast.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => {
      $toast.classList.remove("show");
    }, 2200);
  }

  // ─── Keyboard Navigation ───
  document.addEventListener("keydown", (e) => {
    if ($bottomSheet.classList.contains("open")) return;

    if (e.key === "ArrowDown" || e.key === " ") {
      e.preventDefault();
      scrollToCard(state.currentCardIndex + 1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      scrollToCard(state.currentCardIndex - 1);
    } else if (e.key === "Enter") {
      const card = state.filteredNews[state.currentCardIndex];
      if (card) openSheet(card.id);
    }
  });

  function scrollToCard(idx) {
    const clampedIdx = Math.max(0, Math.min(idx, state.filteredNews.length));
    const cardHeight = window.innerHeight;
    $feedContainer.scrollTo({
      top: clampedIdx * cardHeight,
      behavior: "smooth"
    });
  }

  // ─── Swipe Up to Open Sheet ───
  let touchStartY = 0;
  let touchStartTime = 0;

  document.addEventListener("touchstart", (e) => {
    if ($bottomSheet.classList.contains("open")) return;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
  });

  document.addEventListener("touchend", (e) => {
    if ($bottomSheet.classList.contains("open")) return;
    const diff = touchStartY - e.changedTouches[0].clientY;
    const elapsed = Date.now() - touchStartTime;

    // Quick swipe up (flick) opens detail
    if (diff > 80 && elapsed < 300) {
      const card = state.filteredNews[state.currentCardIndex];
      if (card) openSheet(card.id);
    }
  });

  // ═══════════════════════════════════════
  //  BOOT
  // ═══════════════════════════════════════
  init();
  </script>

</body>
</html>
